[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-daemon"
version = "0.1.0"
description = "Local-first loopback daemon for Folio (SQLite FTS5, Local Markdown, Hindsight MCP/REST, Notion)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
folio-locald = "folio_daemon.server:run_server"

[tool.setuptools.packages.find]
where = ["."]
include = ["folio_daemon*"]
